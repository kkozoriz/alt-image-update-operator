apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: alt-image-update-demo
  labels:
    app.kubernetes.io/name: demo-app
    app.kubernetes.io/part-of: alt-image-update-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-app
        app.kubernetes.io/part-of: alt-image-update-operator
    spec:
      containers:
        - name: app
          image: registry.altlinux.org/alt/alt:p10
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              while true; do
                echo "demo-app initial image waiting for AltImageUpdatePolicy rebuild"
                sleep 30
              done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
