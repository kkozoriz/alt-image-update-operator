apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-context
  labels:
    app.kubernetes.io/name: demo-app
    app.kubernetes.io/part-of: alt-image-update-operator
data:
  Dockerfile: |
    ARG ALT_BASE_IMAGE=registry.altlinux.org/alt/alt:p10
    FROM ${ALT_BASE_IMAGE}

    LABEL org.opencontainers.image.title="alt-image-update-operator demo app"

    RUN apt-get update \
        && apt-get -y dist-upgrade \
        && apt-get clean \
        && rm -rf /var/cache/apt/archives/* /var/lib/apt/lists/*

    RUN printf '%s\n' \
        '#!/bin/sh' \
        'set -eu' \
        'while true; do' \
        '  date -u +"ALT demo image rebuilt at %Y-%m-%dT%H:%M:%SZ"' \
        '  sleep 30' \
        'done' \
        > /usr/local/bin/demo-app \
        && chmod 0755 /usr/local/bin/demo-app

    USER 1000
    CMD ["/usr/local/bin/demo-app"]
