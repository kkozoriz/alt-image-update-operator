---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - pods/log
  - secrets
  verbs:
  - get
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - security.altlinux.org
  resources:
  - altimageupdatepolicies
  verbs:
  - get
  - list
  - update
  - watch
- apiGroups:
  - security.altlinux.org
  resources:
  - altimageupdatepolicies/finalizers
  verbs:
  - update
- apiGroups:
  - security.altlinux.org
  resources:
  - altimageupdatepolicies/status
  verbs:
  - get
  - patch
  - update
